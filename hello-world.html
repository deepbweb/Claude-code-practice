<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
</head>
<body>
  <h1>Hello, World!</h1>
  <button id="counter-btn">Count: 0</button>
  <script>
    var count = 0;
    document.getElementById('counter-btn').addEventListener('click', function () {
      count++;
      this.textContent = 'Count: ' + count;
    });
  </script>
</body>
</html>
